<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stickmönster</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#2a2420;--muted:#7a6f66;--line:#e2d9cf;--accent:#b5483a;--accent-t:#fff;--empty:#f1ede7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#292423;--text:#f0e9e1;--muted:#a89d93;--line:#3d3532;--accent:#e0705f;--accent-t:#1c1917;--empty:#3a3431}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#292423;--text:#f0e9e1;--muted:#a89d93;--line:#3d3532;--accent:#e0705f;--accent-t:#1c1917;--empty:#3a3431}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:1.3rem;margin:4px 0 12px}
h2{font-size:1rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
input[type=number]{width:76px}
input[type=text]{flex:1;min-width:0}
select{height:40px}
textarea{width:100%;height:70px;margin-top:8px;font-size:.8rem}
button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:8px 12px;min-height:40px}
button.p{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
button:disabled{opacity:.4}
.pal{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0;min-height:0}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.er{border-radius:18px;width:auto;padding:0 12px;font-size:.85rem}
input[type=color]{width:36px;height:36px;border:none;padding:0;background:none}
#wrap{display:flex;justify-content:center}
canvas{touch-action:none;border:1px solid var(--line);border-radius:4px;display:block}
.tools{margin-top:10px}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.chip{display:flex;align-items:center;gap:4px}
.chip i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.item div{flex:1;min-width:0}
.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted)}
#msg,#bmsg{font-size:.85rem;color:var(--muted);min-height:1.2em;margin-top:6px}
#img img{max-width:100%;margin-top:10px;border:1px solid var(--line);border-radius:4px}
</style>
</head>
<body>
<main>
<h1>🧶 Stickmönster</h1>

<section class="card">
  <div class="row">
    <label>Rader<input id="rows" type="number" min="1" max="60" inputmode="numeric"></label>
    <label>Kolumner<input id="cols" type="number" min="1" max="60" inputmode="numeric"></label>
    <label>Maskform
      <select id="ratio">
        <option value="1">Kvadrat (1:1)</option>
        <option value="0.8">Maska 5:4</option>
        <option value="0.75">Maska 4:3</option>
        <option value="0.67">Maska 3:2</option>
      </select>
    </label>
    <button id="resize" class="p">Ändra storlek</button>
  </div>
</section>

<section class="card">
  <div class="pal" id="pal"></div>
</section>

<section class="card">
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div class="hint">Tryck på radnumret till vänster för att markera en rad som klar. Rad 1 är nederst.</div>
  <div class="row tools">
    <button id="undo">↶ Ångra</button>
    <button id="fill">Fyll bakgrund</button>
    <button id="clear">Töm</button>
    <button id="reset">Nollställ rader</button>
  </div>
  <div class="chips" id="counts"></div>
</section>

<section class="card">
  <h2>Spara mönster</h2>
  <div class="row">
    <input id="name" type="text" placeholder="Namn på mönstret" maxlength="60">
    <button id="save" class="p">Spara</button>
    <button id="toimg">Som bild</button>
  </div>
  <div id="msg"></div>
  <div id="img"></div>
</section>

<section class="card">
  <h2>Sparade mönster</h2>
  <div id="list"></div>
</section>

<section class="card">
  <h2>Säkerhetskopia</h2>
  <div class="row">
    <button id="exp">Exportera alla</button>
    <button id="imp">Importera</button>
  </div>
  <textarea id="bk" placeholder="Exporterad text visas här. Klistra in text här för att importera."></textarea>
  <div id="bmsg"></div>
</section>
</main>

<script>
const DEF=['#111111','#ffffff','#d62839','#f28c28','#f7d046','#3fa34d','#2b7bd6','#7b4fc9','#e86aa8','#8b5a2b'];
const DK='stick:draft',PK='stick:patterns',GW=30;
let S={rows:20,cols:20,ratio:1,grid:[],done:[],color:DEF[0],palette:DEF.slice()};
let saved=[],hist=[];
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let cw=16,ch=16,painting=false,snap=null,pushed=false;

function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function blank(r,c){return Array.from({length:r},()=>Array(c).fill(''))}
function draft(){store(DK,S)}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function snapshot(){return JSON.stringify({rows:S.rows,cols:S.cols,grid:S.grid,done:S.done})}
function pushHist(s){hist.push(s||snapshot());if(hist.length>60)hist.shift();upd()}
function upd(){$('undo').disabled=!hist.length}
$('undo').onclick=()=>{
  if(!hist.length)return;
  const s=JSON.parse(hist.pop());
  Object.assign(S,s);$('rows').value=S.rows;$('cols').value=S.cols;
  draft();upd();layout();
};

function layout(){
  const w=$('wrap').clientWidth-2;
  cw=Math.max(4,Math.min(36,Math.floor((w-GW)/S.cols)));
  ch=Math.max(4,Math.round(cw*S.ratio));
  const dpr=window.devicePixelRatio||1,W=GW+cw*S.cols,H=ch*S.rows;
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
function draw(){
  const empty=css('--empty')||'#f1ede7',bg=css('--bg'),card=css('--card'),acc=css('--accent'),acct=css('--accent-t'),txt=css('--text');
  ctx.clearRect(0,0,GW+cw*S.cols,ch*S.rows);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='11px system-ui,sans-serif';
  for(let r=0;r<S.rows;r++){
    const n=S.rows-r,dn=S.done[r];
    ctx.fillStyle=dn?acc:card;ctx.fillRect(0,r*ch,GW,ch);
    if(ch>=11||n%5===0){ctx.fillStyle=dn?acct:txt;ctx.fillText(n,GW/2,r*ch+ch/2)}
    for(let c=0;c<S.cols;c++){
      ctx.fillStyle=S.grid[r][c]||empty;
      ctx.fillRect(GW+c*cw,r*ch,cw,ch);
    }
    if(dn){ctx.globalAlpha=.55;ctx.fillStyle=bg;ctx.fillRect(GW,r*ch,cw*S.cols,ch);ctx.globalAlpha=1}
  }
  ctx.lineWidth=1;
  for(let c=0;c<=S.cols;c++){
    ctx.strokeStyle=c%5===0?'rgba(120,110,100,.7)':'rgba(120,110,100,.25)';
    ctx.beginPath();ctx.moveTo(GW+c*cw+.5,0);ctx.lineTo(GW+c*cw+.5,S.rows*ch);ctx.stroke();
  }
  for(let r=0;r<=S.rows;r++){
    ctx.strokeStyle=(S.rows-r)%5===0?'rgba(120,110,100,.7)':'rgba(120,110,100,.25)';
    ctx.beginPath();ctx.moveTo(0,r*ch+.5);ctx.lineTo(GW+S.cols*cw,r*ch+.5);ctx.stroke();
  }
  counts();
}
function counts(){
  const m={};
  S.grid.forEach(r=>r.forEach(v=>{if(v)m[v]=(m[v]||0)+1}));
  $('counts').innerHTML=Object.entries(m).map(([k,v])=>`<span class="chip"><i style="background:${k}"></i>${v}</span>`).join('')
    ||'Tryck eller dra över rutorna för att färglägga.';
}
function cellAt(e){
  const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
  const r=Math.floor(y/ch);
  if(r<0||r>=S.rows)return null;
  if(x<GW)return {r,gutter:true};
  const c=Math.floor((x-GW)/cw);
  return c<S.cols?{r,c}:null;
}
function paint(e){
  const p=cellAt(e);if(!p||p.gutter)return;
  const v=S.color==='erase'?'':S.color;
  if(S.grid[p.r][p.c]!==v){
    if(!pushed){pushHist(snap);pushed=true}
    S.grid[p.r][p.c]=v;draw();
  }
}
cv.addEventListener('pointerdown',e=>{
  const p=cellAt(e);if(!p)return;
  if(p.gutter){pushHist();S.done[p.r]=!S.done[p.r];draft();draw();return}
  painting=true;pushed=false;snap=snapshot();
  cv.setPointerCapture(e.pointerId);paint(e);
});
cv.addEventListener('pointermove',e=>{if(painting)paint(e)});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{if(painting){painting=false;draft()}}));

function pal(){
  const el=$('pal');el.innerHTML='';
  S.palette.forEach(c=>{
    const b=document.createElement('button');
    b.className='sw'+(S.color===c?' on':'');b.style.background=c;b.setAttribute('aria-label','Färg '+c);
    b.onclick=()=>{S.color=c;pal();draft()};el.appendChild(b);
  });
  const e=document.createElement('button');
  e.className='sw er'+(S.color==='erase'?' on':'');e.textContent='Sudda';
  e.onclick=()=>{S.color='erase';pal();draft()};el.appendChild(e);
  const i=document.createElement('input');i.type='color';i.value=/^#/.test(S.color)?S.color:'#000000';
  i.setAttribute('aria-label','Egen färg');
  i.onchange=()=>{const c=i.value;if(!S.palette.includes(c)){S.palette.push(c);if(S.palette.length>24)S.palette.splice(DEF.length,1)}S.color=c;pal();draft()};
  el.appendChild(i);
}

$('resize').onclick=()=>{
  const r=Math.max(1,Math.min(60,parseInt($('rows').value)||S.rows));
  const c=Math.max(1,Math.min(60,parseInt($('cols').value)||S.cols));
  S.ratio=parseFloat($('ratio').value)||1;
  if(r!==S.rows||c!==S.cols){
    pushHist();
    const g=blank(r,c),d=Array(r).fill(false);
    for(let y=0;y<Math.min(r,S.rows);y++){d[y]=S.done[y];for(let x=0;x<Math.min(c,S.cols);x++)g[y][x]=S.grid[y][x]}
    S.rows=r;S.cols=c;S.grid=g;S.done=d;
  }
  $('rows').value=S.rows;$('cols').value=S.cols;draft();layout();
};
$('ratio').onchange=()=>{S.ratio=parseFloat($('ratio').value)||1;draft();layout()};

$('fill').onclick=()=>{
  if(S.color==='erase')return;
  pushHist();
  S.grid=S.grid.map(r=>r.map(v=>v||S.color));
  draft();draw();
};
function arm(b,label,fn){
  b.onclick=()=>{
    if(b.dataset.arm){delete b.dataset.arm;b.textContent=label;fn()}
    else{b.dataset.arm=1;b.textContent='Säker?';setTimeout(()=>{b.textContent=label;delete b.dataset.arm},2500)}
  };
}
arm($('clear'),'Töm',()=>{pushHist();S.grid=blank(S.rows,S.cols);draft();draw()});
$('reset').onclick=()=>{pushHist();S.done=Array(S.rows).fill(false);draft();draw()};

function msg(t){$('msg').textContent=t}
$('save').onclick=()=>{
  const name=$('name').value.trim();
  if(!name){msg('Skriv ett namn först.');return}
  const item={id:Date.now(),name,rows:S.rows,cols:S.cols,ratio:S.ratio,grid:JSON.parse(JSON.stringify(S.grid)),done:S.done.slice(),date:new Date().toLocaleDateString('sv-SE')};
  const i=saved.findIndex(p=>p.name.toLowerCase()===name.toLowerCase());
  if(i>=0){item.id=saved[i].id;saved[i]=item;msg('Mönstret “'+name+'” uppdaterades.')}
  else{saved.unshift(item);msg('Mönstret “'+name+'” sparades.')}
  store(PK,saved);list();
};
$('toimg').onclick=()=>{
  const k=24,h=Math.round(k*S.ratio),c=document.createElement('canvas');
  c.width=S.cols*k;c.height=S.rows*h;
  const x=c.getContext('2d');
  for(let r=0;r<S.rows;r++)for(let q=0;q<S.cols;q++){
    x.fillStyle=S.grid[r][q]||'#f1ede7';x.fillRect(q*k,r*h,k,h);
    x.strokeStyle='rgba(120,110,100,.35)';x.strokeRect(q*k+.5,r*h+.5,k,h);
  }
  const url=c.toDataURL('image/png');
  $('img').innerHTML='<img alt="Mönster" src="'+url+'"><div class="hint">Håll in bilden för att spara eller dela den.</div>';
  c.toBlob(b=>{
    try{const f=new File([b],($('name').value.trim()||'monster')+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{})}catch(e){}
  });
};
function list(){
  const el=$('list');
  if(!saved.length){el.innerHTML='<small style="color:var(--muted)">Inga sparade mönster ännu.</small>';return}
  el.innerHTML='';
  saved.forEach(p=>{
    const d=document.createElement('div');d.className='item';
    const t=document.createElement('div');
    t.innerHTML='<b></b><small>'+p.rows+' × '+p.cols+' · '+p.date+'</small>';
    t.querySelector('b').textContent=p.name;
    const o=document.createElement('button');o.className='p';o.textContent='Öppna';
    o.onclick=()=>{
      pushHist();
      S.rows=p.rows;S.cols=p.cols;S.ratio=p.ratio||1;S.grid=JSON.parse(JSON.stringify(p.grid));
      S.done=(p.done||[]).slice();while(S.done.length<S.rows)S.done.push(false);
      $('rows').value=p.rows;$('cols').value=p.cols;$('ratio').value=String(S.ratio);$('name').value=p.name;
      p.grid.forEach(r=>r.forEach(c=>{if(c&&!S.palette.includes(c))S.palette.push(c)}));
      pal();draft();layout();window.scrollTo({top:0,behavior:'smooth'});
    };
    const x=document.createElement('button');x.textContent='Ta bort';
    arm(x,'Ta bort',()=>{saved=saved.filter(q=>q.id!==p.id);store(PK,saved);list()});
    d.append(t,o,x);el.appendChild(d);
  });
}

$('exp').onclick=()=>{
  const t=JSON.stringify(saved);$('bk').value=t;$('bk').select();
  let ok=false;try{navigator.clipboard.writeText(t).then(()=>{$('bmsg').textContent='Kopierat. Spara texten någonstans säkert.'},()=>{});ok=true}catch(e){}
  if(!ok)$('bmsg').textContent='Markera och kopiera texten ovan.';
};
$('imp').onclick=()=>{
  try{
    const a=JSON.parse($('bk').value);
    if(!Array.isArray(a))throw 0;
    let n=0;
    a.forEach(p=>{
      if(!p||!p.name||!Array.isArray(p.grid)||!p.rows||!p.cols)return;
      const i=saved.findIndex(q=>q.name.toLowerCase()===String(p.name).toLowerCase());
      p.id=i>=0?saved[i].id:Date.now()+n;
      if(i>=0)saved[i]=p;else saved.push(p);n++;
    });
    store(PK,saved);list();$('bmsg').textContent=n+' mönster importerades.';
  }catch(e){$('bmsg').textContent='Texten kunde inte läsas som mönster.'}
};

(function init(){
  const d=load(DK,null);
  if(d&&d.grid&&d.grid.length)S=Object.assign(S,d);else S.grid=blank(S.rows,S.cols);
  while(S.done.length<S.rows)S.done.push(false);
  saved=load(PK,[]);
  $('rows').value=S.rows;$('cols').value=S.cols;$('ratio').value=String(S.ratio);
  pal();list();upd();layout();
  window.addEventListener('resize',layout);
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
})();
</script>
</body>
</html>
